<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>지도 확인용 페이지</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#26303a;overflow:hidden;touch-action:none}</style>
</head>
<body>
<script src="../lib/phaser.min.js"></script>
<script>
// DEMO_SPEC.md 3장(그림과 좌표 규칙)만으로 화면을 그려 보는 확인용 페이지. 게임이 아니다.
// 여는 법: 프로젝트 폴더에서 서버를 켜고  http://localhost:8000/tools/reference_map.html?mode=day
//          mode = day(낮 화면 예시) | night(밤 화면 예시) | full(섬 전체) | defense(2단계: 탑, 철조망, 화살과 총알)
//                 | motion(움직임과 효과: manifest 의 anims 를 모두 만들어 틀고, 조각 효과를 흩뿌린다)
// 바닥 그림 깔기, 좌표 변환, 겹침 순서, 울타리 연결, 밤의 '빛 지도'를 어떻게 하는지 보여 준다.
// 게임 코드는 이 파일을 늘려 가지 말고 DEMO_SPEC.md 2장의 구성대로 새로 짠다.
const HW = 40, HH = 20;
function tileToWorld(col, row) { return { x: (col - row) * HW, y: (col + row) * HH }; }
function worldToTile(x, y) {
  return { col: Math.floor((x / HW + y / HH) / 2 + 0.5), row: Math.floor((y / HH - x / HW) / 2 + 0.5) };
}
// 울타리 그림 번호: 이웃 칸에 울타리가 있으면 1(col+1) 2(col-1) 4(row+1) 8(row-1) 을 더한다 -> build_fence_0 ~ 15
function fenceMask(col, row, has) {
  return (has(col + 1, row) ? 1 : 0) | (has(col - 1, row) ? 2 : 0) | (has(col, row + 1) ? 4 : 0) | (has(col, row - 1) ? 8 : 0);
}
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'day';
const DEF = MODE === 'defense', MOTION = MODE === 'motion';
const NIGHT = MODE === 'night' || DEF, FULL = MODE === 'full';
// 포탑 방향 번호: 땅 위의 방향 = 화면 방향에서 세로를 2배로 편 각도. 16등분해서 가장 가까운 번호.
function turretIndex(x, y, tx, ty, n) {
  const a = Math.atan2((ty - y) * 2, tx - x);
  return ((Math.round(a / (Math.PI * 2 / n)) % n) + n) % n;
}
const NIGHT_COLOR = 0x6670b8;          // 밤의 바탕색(빛 지도를 이 색으로 채운다)
const LIGHTS = [];                     // { x, y, r, color, alpha }  월드 좌표

class Boot extends Phaser.Scene {
  constructor() { super('boot'); }
  preload() {
    this.load.json('manifest', '../assets/manifest.json');
    this.load.json('map', '../data/map.json');
  }
  create() {
    const man = this.cache.json.get('manifest');
    for (const ch of man.meta.ground.chunks) this.load.image(ch.key, '../assets/' + ch.file);
    for (const [k, v] of Object.entries(man.assets)) {
      if (v.frameWidth) this.load.spritesheet(k, '../assets/' + v.file, { frameWidth: v.frameWidth, frameHeight: v.frameHeight });
      else this.load.image(k, '../assets/' + v.file);
    }
    this.load.on('loaderror', (f) => { (window.__loadErrors = window.__loadErrors || []).push(f.key); });
    this.load.once('complete', () => { this.scene.start('game'); this.scene.launch('ui'); });
    this.load.start();
  }
}

// manifest 의 anims 를 Phaser 애니메이션으로 만든다. 이름 = '그림이름:애니메이션이름' (예: 'char_player:walk')
// 프레임마다 duration(ms)을 준다. Phaser 3.90 은 frame.duration 을 그 프레임의 표시 시간으로 그대로 쓴다.
function buildAnims(scene, A) {
  const missing = [];
  let made = 0;
  for (const [key, v] of Object.entries(A)) {
    if (!v.anims) continue;
    for (const [name, a] of Object.entries(v.anims)) {
      const frames = a.frames.map(([f, ms]) => {
        const i = v.frames.indexOf(f);
        if (i < 0) missing.push(key + ':' + f);
        return { key, frame: i, duration: ms };
      });
      scene.anims.create({ key: key + ':' + name, frames, repeat: a.loop ? -1 : 0 });
      made++;
    }
  }
  return { made, missing };
}

class Game extends Phaser.Scene {
  constructor() { super('game'); }
  create() {
    const man = this.cache.json.get('manifest'), map = this.cache.json.get('map');
    const A = man.assets, G = man.meta.ground;
    window.__anims = buildAnims(this, A);
    if (MOTION) { this.setupMotion(A, G); return; }

    // 1) 바닥: 큰 그림 한 장을 조각으로 나눈 것. 각 조각의 왼쪽 위를 월드 좌표 (x, y)에 놓고,
    //    가장자리 여유분 1px을 뺀 안쪽 1022x1022만 그린다. setCrop을 빼면 카메라가 움직일 때 조각 사이에 가는 줄이 보인다.
    const m = G.chunkMargin, step = G.chunkStep;
    for (const ch of G.chunks) this.add.image(ch.x, ch.y, ch.key).setOrigin(0, 0).setCrop(m, m, step, step).setDepth(0);

    // 2) 사물과 캐릭터: 기준점(발)을 칸 중심에 맞추고, 발의 y가 클수록 앞에 그린다.
    const put = (key, col, row, frame) => {
      const w = tileToWorld(col, row), m = A[key];
      const s = frame === undefined ? this.add.image(w.x, w.y, key) : this.add.sprite(w.x, w.y, key, m.frames.indexOf(frame));
      return s.setOrigin(m.originX, m.originY).setDepth(10 + w.y);
    };
    const st = map.playerStart, c0 = st.col - 3, r0 = st.row - 3;
    const dist = (o) => (o.col - st.col) ** 2 + (o.row - st.row) ** 2;
    const trees = map.objects.filter(o => ['tree', 'pine', 'palm'].includes(o.kind)).sort((a, b) => dist(a) - dist(b));
    const cut = new Set(trees.slice(0, FULL ? 0 : 7).map(o => o.col + ',' + o.row));
    for (const o of map.objects) put(cut.has(o.col + ',' + o.row) ? 'obj_stump' : o.sprite, o.col, o.row);

    // 3) 캠프 예시: 7x7 둘레의 울타리, 2x2 텐트, 모닥불
    if (!FULL) {
      const ring = [];
      for (let c = c0; c < c0 + 7; c++) ring.push([c, r0]);
      for (let r = r0 + 1; r < r0 + 7; r++) ring.push([c0 + 6, r]);
      for (let c = c0 + 5; c >= c0; c--) ring.push([c, r0 + 6]);
      for (let r = r0 + 5; r > r0; r--) ring.push([c0, r]);
      const WT = [c0 + 6, r0], GT = [c0, r0 + 6];          // 2단계: 망루(오른쪽 모서리), 총 타워(왼쪽 모서리)
      const isTower = (t) => DEF && ((t[0] === WT[0] && t[1] === WT[1]) || (t[0] === GT[0] && t[1] === GT[1]));
      const built = (NIGHT ? ring : ring.slice(0, 13)).filter(t => !isTower(t));
      const set = new Set(built.map(t => t[0] + ',' + t[1]));
      const has = (c, r) => set.has(c + ',' + r);
      for (const [c, r] of built) put('build_fence_' + fenceMask(c, r, has), c, r);

      put('build_tent', c0 + 2.5, r0 + 2.5);              // 2x2칸: 네 칸의 한가운데에 놓는다
      this.anims.create({ key: 'burn', frames: this.anims.generateFrameNumbers('build_campfire', { start: 0, end: 2 }), frameRate: 6, repeat: -1 });
      const fire = put('build_campfire', c0 + 4, r0 + 4, 'burn1').play('burn');
      const flame = A.build_campfire.flame;
      // 모닥불 빛무리: 월드에 더하기(ADD)로 올린다
      this.add.image(fire.x + flame[0], fire.y + flame[1], 'glow_warm').setBlendMode(Phaser.BlendModes.ADD).setAlpha(NIGHT ? 0.45 : 0.2)
        .setDisplaySize(220, 220).setDepth(fire.depth + 1);
      LIGHTS.push({ x: fire.x + flame[0], y: fire.y + flame[1], r: 300, color: 0xffedc7, alpha: 1 });

      if (DEF) {
        this.setupDefense(A, map, c0, r0, WT, GT, put);
      } else if (NIGHT) {
        const pz = map.pirates;
        const p = put('char_player', c0 + 5.2, r0 + 7.3, 'dagger2').setFlipX(true);
        LIGHTS.push({ x: p.x, y: p.y - 24, r: 150, color: 0xebf0ff, alpha: 0.6, follow: p });
        put('char_zombie', c0 + 5.0, r0 + 8.5, 'attack');
        put('char_zombie', c0 + 7.1, r0 + 3.3, 'attack').setFlipX(true);
        put('char_zombie', c0 + 2.0, r0 - 2.6, 'walk2');
        put('char_zombie', c0 + 9.6, r0 - 1.0, 'walk1').setFlipX(true);
        const ship = put('obj_ship', pz.ship.col, pz.ship.row);
        put('obj_rowboat', pz.boat.col, pz.boat.row);
        put('char_pirate_1', pz.landing.col + 0.2, pz.landing.row - 3.2, 'walk1');
        put('char_pirate_2', pz.landing.col + 2.2, pz.landing.row - 1.6, 'walk2');
        const lamp = A.obj_ship.lamp;
        LIGHTS.push({ x: ship.x + lamp[0], y: ship.y + lamp[1], r: 130, color: 0xffedc7, alpha: 0.9 });
      } else {
        put('char_player', c0 + 5, r0 + 2, 'idle');
        const nxt = ring[13];
        const ok = tileToWorld(nxt[0], nxt[1]);
        this.add.image(ok.x, ok.y, 'overlay_ok').setDepth(3);          // 바닥 표시는 depth 3
        const no = tileToWorld(trees[8].col, trees[8].row);
        this.add.image(no.x, no.y, 'overlay_no').setDepth(3);
      }
    } else {
      put('char_player', st.col, st.row, 'idle');
    }

    // 4) 카메라: 바닥 그림 밖으로 나가지 않게 한다
    const cam = this.cameras.main;
    cam.setBounds(G.x, G.y, G.width, G.height);
    if (FULL) {
      cam.setZoom(this.scale.width / G.width);
      cam.centerOn(G.x + G.width / 2, G.y + G.height / 2);
    } else {
      const w = DEF ? tileToWorld(c0 + 3, r0 + 3) : NIGHT ? tileToWorld(c0 + 1.5, r0 + 7.5) : tileToWorld(c0 + 5.5, r0 + 6.5);
      cam.centerOn(w.x, w.y);
    }

    // 누른 곳이 어느 칸인지 보여 준다(좌표 역변환 확인)
    this.cursor = this.add.image(0, 0, 'overlay_cursor').setDepth(3).setVisible(false);
    this.input.on('pointerdown', (ptr) => {
      const t = worldToTile(ptr.worldX, ptr.worldY), w = tileToWorld(t.col, t.row);
      this.cursor.setPosition(w.x, w.y).setVisible(true);
      window.__tap = t;
      this.scene.get('ui').events.emit('tap', t);
    });
    // 끌어서 화면 옮기기(확인용)
    this.input.on('pointermove', (ptr) => {
      if (ptr.isDown && !FULL) { cam.scrollX -= (ptr.x - ptr.prevPosition.x) / cam.zoom; cam.scrollY -= (ptr.y - ptr.prevPosition.y) / cam.zoom; }
    });
    this.time.delayedCall(400, () => { window.__ready = true; });
  }

  // ---------------------------------------------------------------- 움직임과 효과 확인
  setupMotion(A, G) {
    const m = G.chunkMargin, step = G.chunkStep;
    for (const ch of G.chunks) this.add.image(ch.x, ch.y, ch.key).setOrigin(0, 0).setCrop(m, m, step, step).setDepth(0);
    const cam = this.cameras.main, c = tileToWorld(37, 39);
    cam.setBounds(G.x, G.y, G.width, G.height);
    cam.centerOn(c.x, c.y);
    const x0 = c.x - 860, y0 = c.y - 440;
    const style = { fontFamily: 'sans-serif', fontSize: '15px', color: '#3a2f2a', backgroundColor: '#fbf6eacc', padding: { x: 4, y: 2 } };
    let row = 0;
    window.__played = [];
    for (const key of ['char_player', 'char_zombie', 'char_pirate_1', 'char_pirate_2', 'char_pirate_3', 'fx_swing']) {
      const v = A[key];
      let col = 0;
      for (const name of Object.keys(v.anims)) {
        const x = x0 + col * 104, y = y0 + row * 150;
        const s = this.add.sprite(x, y, key, 0).setOrigin(v.originX, v.originY).setDepth(10 + y);
        const play = () => { s.play(key + ':' + name); window.__played.push(key + ':' + name); };
        play();
        if (!v.anims[name].loop) this.time.addEvent({ delay: 1300, loop: true, callback: play });
        this.add.text(x - 44, y + 22, name, style).setDepth(9999);
        col++;
      }
      row++;
    }
    // 작은 효과들(재생 시트)
    let col = 0;
    for (const key of ['fx_impact', 'fx_dust', 'fx_sparkle', 'fx_vanish', 'fx_splash', 'fx_smoke_puff']) {
      const v = A[key], x = x0 + 900 + col * 110, y = y0 + 6 * 150 - 60;
      const s = this.add.sprite(x, y, key, 0).setOrigin(v.originX, v.originY).setDepth(9000);
      const play = () => s.play(key + ':play');
      play();
      this.time.addEvent({ delay: 1000, loop: true, callback: play });
      this.add.text(x - 40, y + 26, key.replace('fx_', ''), style).setDepth(9999);
      col++;
    }
    // 조각 효과: fx_particles 의 프레임 번호로 Phaser 파티클을 만든다
    const P = A.fx_particles, idx = (n) => P.frames.indexOf(n);
    const bursts = [['wood1', 'wood2', 'leaf1', 'leaf2'], ['stone1', 'stone2', 'dust'], ['iron', 'spark'], ['goo'], ['dirt', 'dust'], ['heart']];
    this.emitters = bursts.map((names, i) => this.add.particles(x0 + 900 + i * 110, y0 + 6 * 150 - 200, 'fx_particles', {
      frame: names.map(idx), lifespan: 700, speed: { min: 120, max: 260 }, angle: { min: 200, max: 340 }, gravityY: 600,
      rotate: { min: 0, max: 360 }, alpha: { start: 1, end: 0 }, scale: { min: 0.8, max: 1.3 }, emitting: false }).setDepth(9500));
    this.time.addEvent({ delay: 800, loop: true, callback: () => this.emitters.forEach(e => e.explode(8)) });
    this.time.delayedCall(400, () => { window.__ready = true; });
  }

  // ---------------------------------------------------------------- 2단계 확인: 탑, 포탑, 철조망, 날아가는 것
  setupDefense(A, map, c0, r0, WT, GT, put) {
    const occupied = new Set(map.objects.map(o => o.col + ',' + o.row));
    const free = (c, r) => !occupied.has(c + ',' + r) && map.terrain[r][c] !== 0;
    const wires = [];
    for (let c = c0 - 1; c < c0 + 8; c++) { wires.push([c, r0 - 2], [c, r0 + 8]); }
    for (let r = r0 - 1; r < r0 + 8; r++) { wires.push([c0 - 2, r], [c0 + 8, r]); }
    const wset = new Set(wires.filter(t => free(t[0], t[1])).map(t => t[0] + ',' + t[1]));
    const hasW = (c, r) => wset.has(c + ',' + r);
    for (const k of wset) { const [c, r] = k.split(',').map(Number); put('build_wire_' + fenceMask(c, r, hasW), c, r); }

    // 탑 = 받침(build_*) + 포탑(turret_*). 포탑은 받침 기준점 + mount 에 놓고, depth 는 받침 바로 위.
    const N = this.cache.json.get('manifest').meta.turretDirections;
    const tower = (baseKey, col, row) => {
      const base = put(baseKey, col, row), m = A[baseKey], tk = m.turret;
      const tur = this.add.sprite(base.x + m.mount[0], base.y + m.mount[1], tk, 0)
        .setOrigin(A[tk].originX, A[tk].originY).setDepth(base.depth + 0.5);
      LIGHTS.push({ x: base.x + m.lamp[0], y: base.y + m.lamp[1], r: 120, color: 0xffedc7, alpha: 0.85 });
      return { base, tur, key: tk, dir: 0, cool: 0 };
    };
    this.towers = [Object.assign(tower('build_watchtower', WT[0], WT[1]), { kind: 'bow', every: 1100 }),
                   Object.assign(tower('build_guntower', GT[0], GT[1]), { kind: 'gun', every: 1600 })];
    const g = tileToWorld(GT[0], GT[1]), R = 6.5;
    this.add.image(g.x, g.y, 'overlay_range').setDisplaySize(2 * R * 56.57, 2 * R * 28.28).setDepth(3).setAlpha(0.9);

    // 캠프 둘레를 도는 좀비(과녁)
    this.anims.create({ key: 'zwalk', frames: this.anims.generateFrameNumbers('char_zombie', { start: 0, end: 1 }), frameRate: 6, repeat: -1 });
    this.target = put('char_zombie', c0 + 3, r0 - 2.5, 'walk1').play('zwalk');
    this.center = [c0 + 3, r0 + 3];
    this.A = A; this.N = N;
    window.__turrets = [];
  }

  update() {
    if (!this.towers) return;
    // 시간은 씬 시계(this.time.now)로 잰다. 트윈, delayedCall 과 같은 시계라서 빨리 감기(timeScale)에도 함께 맞춰진다.
    const time = this.time.now;
    const A = this.A, N = this.N, z = this.target;
    // 과녁 움직이기: 캠프 가운데를 중심으로 반지름 5.6칸의 원(칸 좌표)
    const th = time / 5200;
    const col = this.center[0] + 5.6 * Math.cos(th), row = this.center[1] + 5.6 * Math.sin(th);
    const w = tileToWorld(col, row), px = z.x;
    z.setPosition(w.x, w.y).setDepth(10 + w.y).setFlipX(w.x < px);
    const chest = { x: z.x, y: z.y - 40 };
    window.__turrets = [];
    for (const t of this.towers) {
      t.dir = turretIndex(t.base.x, t.base.y, z.x, z.y, N);
      const name = t.kind === 'bow' ? ((t.shotUntil || 0) > time ? 'shot' : 'load') + t.dir : 'dir' + t.dir;
      t.tur.setFrame(A[t.key].frames.indexOf(name));
      window.__turrets.push({ kind: t.kind, dir: t.dir, frame: name });
      if (time < t.cool) continue;
      t.cool = time + t.every;
      const mz = A[t.key].muzzle[t.dir];
      const from = { x: t.tur.x + mz[0], y: t.tur.y + mz[1] };
      if (t.kind === 'bow') {
        t.shotUntil = time + 250;
        this.fly('proj_arrow', from, chest, 450, Math.min(60, 0.25 * Phaser.Math.Distance.BetweenPoints(from, chest)));
      } else {
        const ang = Phaser.Math.DegToRad(A[t.key].screenAngle[t.dir]);
        const fl = this.add.image(from.x, from.y, 'fx_muzzle').setOrigin(A.fx_muzzle.originX, A.fx_muzzle.originY).setRotation(ang).setDepth(50000);
        this.time.delayedCall(80, () => fl.destroy());
        const sm = this.add.image(from.x, from.y - 6, 'fx_smoke').setDepth(50000);
        this.tweens.add({ targets: sm, y: from.y - 34, alpha: 0, scale: 1.4, duration: 600, onComplete: () => sm.destroy() });
        const L = { x: from.x, y: from.y, r: 110, color: 0xffedc7, alpha: 0.9 };
        LIGHTS.push(L);
        this.time.delayedCall(100, () => LIGHTS.splice(LIGHTS.indexOf(L), 1));
        this.fly('proj_bullet', from, chest, 160, 0);
      }
      window.__fired = (window.__fired || 0) + 1;
    }
  }

  // 날아가는 것: from -> to, ms 동안. h = 포물선 높이(화살). 그림은 오른쪽을 향해 그려져 있어서 날아가는 방향으로 돌린다.
  fly(key, from, to, ms, h) {
    const A = this.A;
    const s = this.add.image(from.x, from.y, key).setOrigin(A[key].originX, A[key].originY).setDepth(50000);
    this.tweens.addCounter({ from: 0, to: 1, duration: ms, onUpdate: (tw) => {
      const t = tw.getValue();
      const x = from.x + (to.x - from.x) * t, y = from.y + (to.y - from.y) * t - h * 4 * t * (1 - t);
      const dx = to.x - from.x, dy = (to.y - from.y) - h * 4 * (1 - 2 * t);
      s.setPosition(x, y).setRotation(Math.atan2(dy, dx));
    }, onComplete: () => { s.destroy(); const hit = this.add.image(to.x, to.y, 'fx_hit').setScale(0.6).setDepth(50000); this.time.delayedCall(150, () => hit.destroy()); } });
  }
}

class UI extends Phaser.Scene {
  constructor() { super('ui'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    if (NIGHT && !MOTION) {
      // 빛 지도: 화면 크기의 그림판. 매 프레임 밤 색으로 채우고 빛을 그린 뒤, 화면에 곱한다(MULTIPLY).
      // UI 씬에서 가장 먼저 만들어야 월드 위, 다른 UI 아래에 그려진다.
      this.lightmap = this.add.renderTexture(0, 0, W, H).setOrigin(0, 0).setBlendMode(Phaser.BlendModes.MULTIPLY);
      this.stamp = this.make.image({ key: 'light_soft', add: false });
    }
    const style = { fontFamily: '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif', fontSize: '28px', fontStyle: 'bold', color: '#4a3d38',
      backgroundColor: '#fbf6ea', padding: { x: 14, y: 8 } };
    const tapText = this.add.text(24, H - 70, '땅을 누르면 칸 번호가 나옵니다', style);
    this.events.on('tap', (t) => tapText.setText('누른 칸: col ' + t.col + ', row ' + t.row));
    this.add.text(24, 24, '확인용 페이지  mode=' + MODE, style);
  }
  update(time) {
    if (!this.lightmap) return;
    const cam = this.scene.get('game').cameras.main, rt = this.lightmap;
    rt.fill(NIGHT_COLOR);
    for (const L of LIGHTS) {
      if (L.follow) { L.x = L.follow.x; L.y = L.follow.y - 24; }
      const flicker = L.r >= 300 ? 1 + 0.03 * Math.sin(time / 90) + 0.02 * Math.sin(time / 37) : 1;      // 모닥불만 살짝 일렁임
      const size = L.r * 2 * flicker * cam.zoom;
      this.stamp.setTint(L.color).setAlpha(L.alpha).setDisplaySize(size, size);
      // 월드 좌표 -> 화면 좌표 (cam.worldView 는 반올림된 값이라 쓰지 않는다)
      rt.draw(this.stamp, (L.x - cam.midPoint.x) * cam.zoom + cam.width / 2, (L.y - cam.midPoint.y) * cam.zoom + cam.height / 2);
    }
  }
}

window.__game = new Phaser.Game({
  type: Phaser.AUTO, width: 1920, height: 1200, backgroundColor: '#5fa9c8',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Boot, Game, UI],
});
</script>
