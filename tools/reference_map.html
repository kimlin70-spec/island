<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>지도 확인용 페이지</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#26303a;overflow:hidden;touch-action:none}</style>
</head>
<body>
<script src="../lib/phaser.min.js"></script>
<script>
// DEMO_SPEC.md 3장(그림과 좌표 규칙)만으로 화면을 그려 보는 확인용 페이지. 게임이 아니다.
// 여는 법: 프로젝트 폴더에서 서버를 켜고  http://localhost:8000/tools/reference_map.html?mode=day
//          mode = day(낮 화면 예시) | night(밤 화면 예시) | full(섬 전체) | defense(2단계: 탑, 철조망, 화살과 총알)
//                 | motion(움직임과 효과: manifest 의 anims 를 모두 만들어 틀고, 조각 효과를 흩뿌린다)
//                 | farm(3단계: 문, 밭, 동물)  &weather=rain | snow 를 붙이면 비, 눈. 화면을 누르면 효과음이 난다
//                 | underground(17장: 지하. 안 판 칸을 누르면 파고, 사다리를 누르면 오르내린다)
// 바닥 그림 깔기, 좌표 변환, 겹침 순서, 울타리 연결, 밤의 '빛 지도'를 어떻게 하는지 보여 준다.
// 게임 코드는 이 파일을 늘려 가지 말고 DEMO_SPEC.md 2장의 구성대로 새로 짠다.
const HW = 40, HH = 20;
function tileToWorld(col, row) { return { x: (col - row) * HW, y: (col + row) * HH }; }
function worldToTile(x, y) {
  return { col: Math.floor((x / HW + y / HH) / 2 + 0.5), row: Math.floor((y / HH - x / HW) / 2 + 0.5) };
}
// 울타리 그림 번호: 이웃 칸에 울타리가 있으면 1(col+1) 2(col-1) 4(row+1) 8(row-1) 을 더한다 -> build_fence_0 ~ 15
function fenceMask(col, row, has) {
  return (has(col + 1, row) ? 1 : 0) | (has(col - 1, row) ? 2 : 0) | (has(col, row + 1) ? 4 : 0) | (has(col, row - 1) ? 8 : 0);
}
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'day';
const DEF = MODE === 'defense', MOTION = MODE === 'motion', FARM = MODE === 'farm', UGM = MODE === 'underground';
const WEATHER = Q.get('weather') || 'clear';
const NIGHT = MODE === 'night' || DEF || UGM, FULL = MODE === 'full';
// 포탑 방향 번호: 땅 위의 방향 = 화면 방향에서 세로를 2배로 편 각도. 16등분해서 가장 가까운 번호.
function turretIndex(x, y, tx, ty, n) {
  const a = Math.atan2((ty - y) * 2, tx - x);
  return ((Math.round(a / (Math.PI * 2 / n)) % n) + n) % n;
}
const NIGHT_COLOR = 0x6670b8;          // 밤의 바탕색(빛 지도를 이 색으로 채운다)
const UG_COLOR = 0x403a4c;             // 17장: 지하의 화면색(낮밤과 상관없이 늘 이 색)
const LIGHTS = [];                     // { x, y, r, color, alpha }  월드 좌표

class Boot extends Phaser.Scene {
  constructor() { super('boot'); }
  preload() {
    this.load.json('manifest', '../assets/manifest.json');
    this.load.json('map', '../data/map.json');
  }
  create() {
    const man = this.cache.json.get('manifest');
    for (const ch of man.meta.ground.chunks) this.load.image(ch.key, '../assets/' + ch.file);
    if (FARM) for (const ch of man.meta.ground.snowChunks) this.load.image(ch.key, '../assets/' + ch.file);   // 3단계: 눈 덮인 바닥 조각
    if (FARM || UGM) for (const [k, v] of Object.entries(man.sounds || {})) this.load.audio('sfx_' + k, '../assets/' + v.file);   // 효과음
    for (const [k, v] of Object.entries(man.assets)) {
      if (v.frameWidth) this.load.spritesheet(k, '../assets/' + v.file, { frameWidth: v.frameWidth, frameHeight: v.frameHeight });
      else this.load.image(k, '../assets/' + v.file);
    }
    this.load.on('loaderror', (f) => { (window.__loadErrors = window.__loadErrors || []).push(f.key); });
    this.load.once('complete', () => { this.scene.start('game'); this.scene.launch('ui'); });
    this.load.start();
  }
}

// manifest 의 anims 를 Phaser 애니메이션으로 만든다. 이름 = '그림이름:애니메이션이름' (예: 'char_player:walk')
// 프레임마다 duration(ms)을 준다. Phaser 3.90 은 frame.duration 을 그 프레임의 표시 시간으로 그대로 쓴다.
function buildAnims(scene, A) {
  const missing = [];
  let made = 0;
  for (const [key, v] of Object.entries(A)) {
    if (!v.anims) continue;
    for (const [name, a] of Object.entries(v.anims)) {
      const frames = a.frames.map(([f, ms]) => {
        const i = v.frames.indexOf(f);
        if (i < 0) missing.push(key + ':' + f);
        return { key, frame: i, duration: ms };
      });
      scene.anims.create({ key: key + ':' + name, frames, repeat: a.loop ? -1 : 0 });
      made++;
    }
  }
  return { made, missing };
}

class Game extends Phaser.Scene {
  constructor() { super('game'); }
  create() {
    const man = this.cache.json.get('manifest'), map = this.cache.json.get('map');
    const A = man.assets, G = man.meta.ground;
    window.__anims = buildAnims(this, A);
    if (MOTION) { this.setupMotion(A, G); return; }
    if (FARM) { this.setupFarm(man, map); return; }
    if (UGM) { this.setupUnderground(man, map); return; }

    // 1) 바닥: 큰 그림 한 장을 조각으로 나눈 것. 각 조각의 왼쪽 위를 월드 좌표 (x, y)에 놓고,
    //    가장자리 여유분 1px을 뺀 안쪽 1022x1022만 그린다. setCrop을 빼면 카메라가 움직일 때 조각 사이에 가는 줄이 보인다.
    const m = G.chunkMargin, step = G.chunkStep;
    for (const ch of G.chunks) this.add.image(ch.x, ch.y, ch.key).setOrigin(0, 0).setCrop(m, m, step, step).setDepth(0);

    // 2) 사물과 캐릭터: 기준점(발)을 칸 중심에 맞추고, 발의 y가 클수록 앞에 그린다.
    const put = (key, col, row, frame) => {
      const w = tileToWorld(col, row), m = A[key];
      const s = frame === undefined ? this.add.image(w.x, w.y, key) : this.add.sprite(w.x, w.y, key, m.frames.indexOf(frame));
      return s.setOrigin(m.originX, m.originY).setDepth(10 + w.y);
    };
    const st = map.playerStart, c0 = st.col - 3, r0 = st.row - 3;
    const dist = (o) => (o.col - st.col) ** 2 + (o.row - st.row) ** 2;
    const trees = map.objects.filter(o => ['tree', 'pine', 'palm'].includes(o.kind)).sort((a, b) => dist(a) - dist(b));
    const cut = new Set(trees.slice(0, FULL ? 0 : 7).map(o => o.col + ',' + o.row));
    for (const o of map.objects) put(cut.has(o.col + ',' + o.row) ? 'obj_stump' : o.sprite, o.col, o.row);

    // 3) 캠프 예시: 7x7 둘레의 울타리, 2x2 텐트, 모닥불
    if (!FULL) {
      const ring = [];
      for (let c = c0; c < c0 + 7; c++) ring.push([c, r0]);
      for (let r = r0 + 1; r < r0 + 7; r++) ring.push([c0 + 6, r]);
      for (let c = c0 + 5; c >= c0; c--) ring.push([c, r0 + 6]);
      for (let r = r0 + 5; r > r0; r--) ring.push([c0, r]);
      const WT = [c0 + 6, r0], GT = [c0, r0 + 6];          // 2단계: 망루(오른쪽 모서리), 총 타워(왼쪽 모서리)
      const isTower = (t) => DEF && ((t[0] === WT[0] && t[1] === WT[1]) || (t[0] === GT[0] && t[1] === GT[1]));
      const built = (NIGHT ? ring : ring.slice(0, 13)).filter(t => !isTower(t));
      const set = new Set(built.map(t => t[0] + ',' + t[1]));
      const has = (c, r) => set.has(c + ',' + r);
      for (const [c, r] of built) put('build_fence_' + fenceMask(c, r, has), c, r);

      put('build_tent', c0 + 2.5, r0 + 2.5);              // 2x2칸: 네 칸의 한가운데에 놓는다
      this.anims.create({ key: 'burn', frames: this.anims.generateFrameNumbers('build_campfire', { start: 0, end: 2 }), frameRate: 6, repeat: -1 });
      const fire = put('build_campfire', c0 + 4, r0 + 4, 'burn1').play('burn');
      const flame = A.build_campfire.flame;
      // 모닥불 빛무리: 월드에 더하기(ADD)로 올린다
      this.add.image(fire.x + flame[0], fire.y + flame[1], 'glow_warm').setBlendMode(Phaser.BlendModes.ADD).setAlpha(NIGHT ? 0.45 : 0.2)
        .setDisplaySize(220, 220).setDepth(fire.depth + 1);
      LIGHTS.push({ x: fire.x + flame[0], y: fire.y + flame[1], r: 300, color: 0xffedc7, alpha: 1 });

      if (DEF) {
        this.setupDefense(A, map, c0, r0, WT, GT, put);
      } else if (NIGHT) {
        const pz = map.pirates;
        const p = put('char_player', c0 + 5.2, r0 + 7.3, 'dagger2').setFlipX(true);
        LIGHTS.push({ x: p.x, y: p.y - 24, r: 150, color: 0xebf0ff, alpha: 0.6, follow: p });
        put('char_zombie', c0 + 5.0, r0 + 8.5, 'attack');
        put('char_zombie', c0 + 7.1, r0 + 3.3, 'attack').setFlipX(true);
        put('char_zombie', c0 + 2.0, r0 - 2.6, 'walk2');
        put('char_zombie', c0 + 9.6, r0 - 1.0, 'walk1').setFlipX(true);
        const ship = put('obj_ship', pz.ship.col, pz.ship.row);
        put('obj_rowboat', pz.boat.col, pz.boat.row);
        put('char_pirate_1', pz.landing.col + 0.2, pz.landing.row - 3.2, 'walk1');
        put('char_pirate_2', pz.landing.col + 2.2, pz.landing.row - 1.6, 'walk2');
        const lamp = A.obj_ship.lamp;
        LIGHTS.push({ x: ship.x + lamp[0], y: ship.y + lamp[1], r: 130, color: 0xffedc7, alpha: 0.9 });
      } else {
        put('char_player', c0 + 5, r0 + 2, 'idle');
        const nxt = ring[13];
        const ok = tileToWorld(nxt[0], nxt[1]);
        this.add.image(ok.x, ok.y, 'overlay_ok').setDepth(3);          // 바닥 표시는 depth 3
        const no = tileToWorld(trees[8].col, trees[8].row);
        this.add.image(no.x, no.y, 'overlay_no').setDepth(3);
      }
    } else {
      put('char_player', st.col, st.row, 'idle');
    }

    // 4) 카메라: 바닥 그림 밖으로 나가지 않게 한다
    const cam = this.cameras.main;
    cam.setBounds(G.x, G.y, G.width, G.height);
    if (FULL) {
      cam.setZoom(this.scale.width / G.width);
      cam.centerOn(G.x + G.width / 2, G.y + G.height / 2);
    } else {
      const w = DEF ? tileToWorld(c0 + 3, r0 + 3) : NIGHT ? tileToWorld(c0 + 1.5, r0 + 7.5) : tileToWorld(c0 + 5.5, r0 + 6.5);
      cam.centerOn(w.x, w.y);
    }

    // 누른 곳이 어느 칸인지 보여 준다(좌표 역변환 확인)
    this.cursor = this.add.image(0, 0, 'overlay_cursor').setDepth(3).setVisible(false);
    this.input.on('pointerdown', (ptr) => {
      const t = worldToTile(ptr.worldX, ptr.worldY), w = tileToWorld(t.col, t.row);
      this.cursor.setPosition(w.x, w.y).setVisible(true);
      window.__tap = t;
      this.scene.get('ui').events.emit('tap', t);
    });
    // 끌어서 화면 옮기기(확인용)
    this.input.on('pointermove', (ptr) => {
      if (ptr.isDown && !FULL) { cam.scrollX -= (ptr.x - ptr.prevPosition.x) / cam.zoom; cam.scrollY -= (ptr.y - ptr.prevPosition.y) / cam.zoom; }
    });
    this.time.delayedCall(400, () => { window.__ready = true; });
  }

  // ---------------------------------------------------------------- 움직임과 효과 확인
  setupMotion(A, G) {
    const m = G.chunkMargin, step = G.chunkStep;
    for (const ch of G.chunks) this.add.image(ch.x, ch.y, ch.key).setOrigin(0, 0).setCrop(m, m, step, step).setDepth(0);
    const cam = this.cameras.main, c = tileToWorld(37, 39);
    cam.setBounds(G.x, G.y, G.width, G.height);
    cam.centerOn(c.x, c.y);
    const x0 = c.x - 860, y0 = c.y - 440;
    const style = { fontFamily: 'sans-serif', fontSize: '15px', color: '#3a2f2a', backgroundColor: '#fbf6eacc', padding: { x: 4, y: 2 } };
    let row = 0;
    window.__played = [];
    for (const key of ['char_player', 'char_zombie', 'char_pirate_1', 'char_pirate_2', 'char_pirate_3', 'fx_swing']) {
      const v = A[key];
      let col = 0;
      for (const name of Object.keys(v.anims)) {
        const x = x0 + col * 104, y = y0 + row * 150;
        const s = this.add.sprite(x, y, key, 0).setOrigin(v.originX, v.originY).setDepth(10 + y);
        const play = () => { s.play(key + ':' + name); window.__played.push(key + ':' + name); };
        play();
        if (!v.anims[name].loop) this.time.addEvent({ delay: 1300, loop: true, callback: play });
        this.add.text(x - 44, y + 22, name, style).setDepth(9999);
        col++;
      }
      row++;
    }
    // 작은 효과들(재생 시트)
    let col = 0;
    for (const key of ['fx_impact', 'fx_dust', 'fx_sparkle', 'fx_vanish', 'fx_splash', 'fx_smoke_puff']) {
      const v = A[key], x = x0 + 900 + col * 110, y = y0 + 6 * 150 - 60;
      const s = this.add.sprite(x, y, key, 0).setOrigin(v.originX, v.originY).setDepth(9000);
      const play = () => s.play(key + ':play');
      play();
      this.time.addEvent({ delay: 1000, loop: true, callback: play });
      this.add.text(x - 40, y + 26, key.replace('fx_', ''), style).setDepth(9999);
      col++;
    }
    // 조각 효과: fx_particles 의 프레임 번호로 Phaser 파티클을 만든다
    const P = A.fx_particles, idx = (n) => P.frames.indexOf(n);
    const bursts = [['wood1', 'wood2', 'leaf1', 'leaf2'], ['stone1', 'stone2', 'dust'], ['iron', 'spark'], ['goo'], ['dirt', 'dust'], ['heart']];
    this.emitters = bursts.map((names, i) => this.add.particles(x0 + 900 + i * 110, y0 + 6 * 150 - 200, 'fx_particles', {
      frame: names.map(idx), lifespan: 700, speed: { min: 120, max: 260 }, angle: { min: 200, max: 340 }, gravityY: 600,
      rotate: { min: 0, max: 360 }, alpha: { start: 1, end: 0 }, scale: { min: 0.8, max: 1.3 }, emitting: false }).setDepth(9500));
    this.time.addEvent({ delay: 800, loop: true, callback: () => this.emitters.forEach(e => e.explode(8)) });
    this.time.delayedCall(400, () => { window.__ready = true; });
  }

  // ---------------------------------------------------------------- 3단계 확인: 문, 밭, 동물, 날씨, 효과음
  setupFarm(man, map) {
    const A = man.assets, G = man.meta.ground, m = G.chunkMargin, step = G.chunkStep;
    for (const ch of G.chunks) this.add.image(ch.x, ch.y, ch.key).setOrigin(0, 0).setCrop(m, m, step, step).setDepth(0);
    // 눈 바닥: 같은 자리에 겹쳐 두고 투명도로 쌓이고 녹는 것을 보여 준다(depth 1, 밭 흙보다 아래)
    const snow = G.snowChunks.map(ch => this.add.image(ch.x, ch.y, ch.key).setOrigin(0, 0).setCrop(m, m, step, step).setDepth(1).setAlpha(0));
    if (WEATHER === 'snow') this.tweens.add({ targets: snow, alpha: 1, duration: 3000 });
    const put = (key, col, row, frame, depthAdd = 0) => {
      const w = tileToWorld(col, row), v = A[key];
      const s = frame === undefined ? this.add.image(w.x, w.y, key) : this.add.sprite(w.x, w.y, key, v.frames.indexOf(frame));
      return s.setOrigin(v.originX, v.originY).setDepth(10 + w.y + depthAdd);
    };
    for (const o of map.objects) put(o.sprite, o.col, o.row);
    const c0 = map.playerStart.col - 3, r0 = map.playerStart.row - 3, GATE = [c0 + 6, r0 + 3];
    const ring = [];
    for (let c = c0; c < c0 + 7; c++) ring.push([c, r0], [c, r0 + 6]);
    for (let r = r0 + 1; r < r0 + 6; r++) ring.push([c0, r], [c0 + 6, r]);
    const fences = ring.filter(t => !(t[0] === GATE[0] && t[1] === GATE[1]));
    const set = new Set(ring.map(t => t[0] + ',' + t[1]));             // 문도 울타리의 이웃으로 친다
    const has = (c, r) => set.has(c + ',' + r);
    for (const [c, r] of fences) put('build_fence_' + fenceMask(c, r, has), c, r);
    const axis = (has(GATE[0] + 1, GATE[1]) || has(GATE[0] - 1, GATE[1])) ? 'col' : 'row';
    const gate = put('build_gate_' + axis, GATE[0], GATE[1], 'closed');
    put('build_tent', c0 + 2.5, r0 + 2.5);
    // 밭: 흙은 depth 2(바닥에 붙는 것), 작물은 사물처럼 10 + y
    const crops = ['carrot', 'corn', 'pumpkin'], stages = A.crop_carrot.frames;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) {
      const col = c0 + 8 + i, row = r0 + j, w = tileToWorld(col, row);
      this.add.sprite(w.x, w.y, 'farm_soil', (WEATHER === 'rain' || j % 2) ? 1 : 0).setOrigin(A.farm_soil.originX, A.farm_soil.originY).setDepth(2);
      put('crop_' + crops[i], col, row, stages[3 - j]);
    }
    // 주인공이 문을 지나 밭까지 오가고, 강아지가 따라온다. 문은 가까이 오면 열리고 멀어지면 닫힌다.
    const p = put('char_player', c0 + 4, r0 + 3, 'idle');
    const dog = put('char_dog', c0 + 3, r0 + 3.5, 'idle');
    const cat = put('char_cat', c0 + 1.3, r0 + 4.4, 'sleep1').play('char_cat:sleep');
    const em = A.char_cat.emote.sleep1;
    this.add.sprite(cat.x + em[0], cat.y + em[1], 'fx_emote').setOrigin(A.fx_emote.originX, A.fx_emote.originY).setDepth(50000).play('fx_emote:zzz');
    const route = { u: 0 };
    this.tweens.add({ targets: route, u: 1, duration: 2600, yoyo: true, repeat: -1, hold: 900, repeatDelay: 900, ease: 'Sine.easeInOut' });
    let gateOpen = false, lastX = p.x, dogAnim = '';
    this.events.on('update', () => {
      const col = c0 + 4 + 4.2 * route.u, w = tileToWorld(col, r0 + 3);
      const moving = Math.abs(w.x - lastX) > 0.05, right = w.x >= lastX;
      p.setPosition(w.x, w.y).setDepth(10 + w.y).setFlipX(!right);
      const pa = moving ? 'char_player:walk' : 'char_player:idle';
      if (p.anims.currentAnim?.key !== pa) p.play(pa);
      lastX = w.x;
      const dw = tileToWorld(col - (right ? 1.1 : -1.1), r0 + 3.6);
      dog.setPosition(dw.x, dw.y).setDepth(10 + dw.y).setFlipX(!right);
      const da = moving ? 'char_dog:walk' : 'char_dog:sit';
      if (dogAnim !== da) { dog.play(da); dogAnim = da; }
      const near = Math.min(Math.abs(col - GATE[0]), Math.abs(col - (right ? 1.1 : -1.1) - GATE[0])) < 1.3;
      if (near !== gateOpen) { gateOpen = near; gate.play('build_gate_' + axis + (near ? ':open' : ':close')); this.sfx(near ? 'gate_open' : 'gate_close'); }
      window.__gate = gate.frame.name;
    });
    this.setupWeather(A);
    const cam = this.cameras.main, c = tileToWorld(c0 + 5.5, r0 + 3.5);
    cam.setBounds(G.x, G.y, G.width, G.height);
    cam.centerOn(c.x, c.y);
    // 효과음: 처음 누를 때 브라우저가 소리를 허락한다(Phaser 가 알아서 처리). 누를 때마다 다음 소리를 들려준다.
    const names = Object.keys(man.sounds || {});
    let k = 0;
    this.input.on('pointerdown', () => { const n = names[k++ % names.length]; this.sfx(n); this.scene.get('ui').events.emit('sound', n); });
    window.__sounds = names.filter(n => this.cache.audio.exists('sfx_' + n)).length;
    this.time.delayedCall(400, () => { window.__ready = true; });
  }

  sfx(name) { if (this.sound.locked) return; this.sound.play('sfx_' + name, { volume: 0.8 }); }

  setupWeather(A) {
    if (WEATHER === 'clear') return;
    const W = this.scale.width, H = this.scale.height, ui = this.scene.get('ui');
    // 비, 눈 무늬: 화면에 고정된 TileSprite 두 장(가까운 것은 크게, 빠르게)
    const key = WEATHER === 'rain' ? 'overlay_rain' : 'overlay_snow';
    const far = this.add.tileSprite(0, 0, W, H, key).setOrigin(0, 0).setScrollFactor(0).setDepth(60000).setAlpha(WEATHER === 'rain' ? 0.6 : 0.8);
    const near = this.add.tileSprite(0, 0, W, H, key).setOrigin(0, 0).setScrollFactor(0).setDepth(60001).setTileScale(1.7).setAlpha(WEATHER === 'rain' ? 0.45 : 0.6);
    const shade = this.add.rectangle(0, 0, W, H, WEATHER === 'rain' ? 0xc7d1e6 : 0xf0f4ff).setOrigin(0, 0).setScrollFactor(0).setDepth(59999)
      .setBlendMode(Phaser.BlendModes.MULTIPLY);
    this.events.on('update', (t, dt) => {
      if (WEATHER === 'rain') { far.tilePositionY -= dt * 0.9; far.tilePositionX -= dt * 0.2; near.tilePositionY -= dt * 1.5; near.tilePositionX -= dt * 0.33; }
      else { far.tilePositionY -= dt * 0.05; far.tilePositionX = 20 * Math.sin(t / 1400); near.tilePositionY -= dt * 0.09; near.tilePositionX = 30 * Math.sin(t / 1100); }
    });
    if (WEATHER === 'rain') {
      // 땅에 튀는 빗방울: 화면 안의 아무 곳에 짧게
      const cam = this.cameras.main;
      this.time.addEvent({ delay: 60, loop: true, callback: () => {
        const v = cam.worldView, x = v.x + Math.random() * v.width, y = v.y + 120 + Math.random() * (v.height - 120);
        const s = this.add.sprite(x, y, 'fx_rain_splash').setOrigin(A.fx_rain_splash.originX, A.fx_rain_splash.originY).setDepth(3).play('fx_rain_splash:play');
        s.once('animationcomplete', () => s.destroy());
      } });
    }
    window.__weather = { far: far.texture.key, near: near.texture.key, shade: !!shade };
  }

  // ---------------------------------------------------------------- 2단계 확인: 탑, 포탑, 철조망, 날아가는 것
  setupDefense(A, map, c0, r0, WT, GT, put) {
    const occupied = new Set(map.objects.map(o => o.col + ',' + o.row));
    const free = (c, r) => !occupied.has(c + ',' + r) && map.terrain[r][c] !== 0;
    const wires = [];
    for (let c = c0 - 1; c < c0 + 8; c++) { wires.push([c, r0 - 2], [c, r0 + 8]); }
    for (let r = r0 - 1; r < r0 + 8; r++) { wires.push([c0 - 2, r], [c0 + 8, r]); }
    const wset = new Set(wires.filter(t => free(t[0], t[1])).map(t => t[0] + ',' + t[1]));
    const hasW = (c, r) => wset.has(c + ',' + r);
    for (const k of wset) { const [c, r] = k.split(',').map(Number); put('build_wire_' + fenceMask(c, r, hasW), c, r); }

    // 탑 = 받침(build_*) + 포탑(turret_*). 포탑은 받침 기준점 + mount 에 놓고, depth 는 받침 바로 위.
    const N = this.cache.json.get('manifest').meta.turretDirections;
    const tower = (baseKey, col, row) => {
      const base = put(baseKey, col, row), m = A[baseKey], tk = m.turret;
      const tur = this.add.sprite(base.x + m.mount[0], base.y + m.mount[1], tk, 0)
        .setOrigin(A[tk].originX, A[tk].originY).setDepth(base.depth + 0.5);
      LIGHTS.push({ x: base.x + m.lamp[0], y: base.y + m.lamp[1], r: 120, color: 0xffedc7, alpha: 0.85 });
      return { base, tur, key: tk, dir: 0, cool: 0 };
    };
    this.towers = [Object.assign(tower('build_watchtower', WT[0], WT[1]), { kind: 'bow', every: 1100 }),
                   Object.assign(tower('build_guntower', GT[0], GT[1]), { kind: 'gun', every: 1600 })];
    const g = tileToWorld(GT[0], GT[1]), R = 6.5;
    this.add.image(g.x, g.y, 'overlay_range').setDisplaySize(2 * R * 56.57, 2 * R * 28.28).setDepth(3).setAlpha(0.9);

    // 캠프 둘레를 도는 좀비(과녁)
    this.anims.create({ key: 'zwalk', frames: this.anims.generateFrameNumbers('char_zombie', { start: 0, end: 1 }), frameRate: 6, repeat: -1 });
    this.target = put('char_zombie', c0 + 3, r0 - 2.5, 'walk1').play('zwalk');
    this.center = [c0 + 3, r0 + 3];
    this.A = A; this.N = N;
    window.__turrets = [];
  }

  // ---------------------------------------------------------------- 17장 확인: 지하(칸 단위 파기, 조각 고르기, 가구, 빛, 사다리)
  // 이 페이지는 지하만 그리므로 월드 y 를 옮기지 않았다(게임에서는 ug.offsetY 만큼 아래에 만든다, 17.2).
  setupUnderground(man, map) {
    const A = man.assets, F = map.underground.floors[0];
    this.cameras.main.setBackgroundColor('#2a2019');                    // 안 판 곳(어둠) = 바탕색
    const K = (c, r) => c + ',' + r;
    const dug = new Set(F.startDug.map(p => K(p.col, p.row)));
    const ores = new Set(F.ores.map(p => K(p.col, p.row))), spores = new Set(F.spores.map(p => K(p.col, p.row)));
    const isDug = (c, r) => dug.has(K(c, r));
    const tall = (c, r) => !isDug(c, r) && (isDug(c + 1, r) || isDug(c, r + 1) || isDug(c + 1, r + 1));   // 벽이 서는 흙 덩어리
    const solid = (c, r) => isDug(c, r) || tall(c, r);
    const pieces = [];
    const place = (k, c, r, depth) => {
      const w = tileToWorld(c, r), v = A[k];
      const s = this.add.image(w.x, w.y, k).setOrigin(v.originX, v.originY).setDepth(depth);
      pieces.push(s);
      return s;
    };
    // 17.3 조각 고르기: 파낸 칸이 바뀔 때마다 다시 고른다(여기서는 전부 지우고 다시 놓는다)
    const rebuild = () => {
      pieces.forEach(s => s.destroy());
      pieces.length = 0;
      for (let r = -1; r <= F.rows; r++) for (let c = -1; c <= F.cols; c++) {
        const y = tileToWorld(c, r).y;
        if (isDug(c, r)) place('ug_floor_' + ((c * 7 + r * 3) % 3 + 1), c, r, 1);
        if (solid(c, r)) {
          if (!solid(c, r + 1)) place('ug_cut_l', c, r, 1.5);
          if (!solid(c + 1, r)) place('ug_cut_r', c, r, 1.5);
        }
        if (tall(c, r)) {
          Object.assign(place('ug_cap', c, r, 10 + y - 1.5), { target: [c, r], tallPiece: true });
          for (const [side, fc, fr] of [['l', c + 1, r], ['r', c, r + 1]]) {
            if (tall(fc, fr)) continue;
            const kind = ores.has(K(c, r)) ? 'iron' : spores.has(K(c, r)) ? 'mush'
              : (isDug(fc, fr) && (c * 7 + r * 13 + (side === 'l' ? 3 : 0)) % 5 === 0) ? 'b' : 'a';
            Object.assign(place('ug_wall_' + side + '_' + kind, fc, fr, 10 + tileToWorld(fc, fr).y - 21), { target: [c, r], tallPiece: true });
          }
        }
        if (isDug(c, r) && tall(c - 1, r) && tall(c, r - 1)) Object.assign(place('ug_pillar', c, r, 10 + y - 20.5), { tallPiece: true });
      }
      window.__ug = { dug: dug.size, pieces: pieces.length, walls: pieces.filter(s => s.texture.key.startsWith('ug_wall')).length };
    };
    rebuild();

    // 가구와 사다리(처음 방 3x3: col 13~15, row 13~15)
    const put = (key, col, row, frame, depth) => {
      const w = tileToWorld(col, row), v = A[key];
      const s = frame === undefined ? this.add.image(w.x, w.y, key) : this.add.sprite(w.x, w.y, key, v.frames.indexOf(frame));
      return s.setOrigin(v.originX, v.originY).setDepth(depth === undefined ? 10 + w.y : depth);
    };
    const E = F.entry, ladder = put('ug_ladder', E.col, E.row);
    put('build_bed', 14.5, 13, 'empty');
    const fire = put('build_fireplace', 13, 15, 'burn1').play('build_fireplace:burn');
    put('build_rug', 14.5, 14.5, undefined, 2);
    put('build_chest', 15, 14, 'closed');
    const lamp = put('build_lantern', 15, 15, 'on');
    put('ug_hole', F.sealedHole.col, F.sealedHole.row, 'locked');
    const p = put('char_player', 14, 14, 'idle').play('char_player:idle');
    // 빛: 벽난로(일렁임), 등불, 입구의 햇빛 기둥, 주인공
    const fl = A.build_fireplace.flame, lp = A.build_lantern.lamp;                 // 기준점에서 불꽃·등불까지(뒤집으면 x 를 반대로)
    this.add.image(fire.x + fl[0], fire.y + fl[1], 'glow_warm').setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.45).setDisplaySize(220, 220).setDepth(fire.depth + 1);
    LIGHTS.push({ x: fire.x + fl[0], y: fire.y + fl[1], r: 300, color: 0xffedc7, alpha: 1 });
    LIGHTS.push({ x: lamp.x + lp[0], y: lamp.y + lp[1], r: 210, color: 0xffedc7, alpha: 0.9 });
    const sh = A.glow_shaft;
    this.add.image(ladder.x, ladder.y, 'glow_shaft').setOrigin(sh.originX, sh.originY).setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.55).setDepth(ladder.depth + 1);
    LIGHTS.push({ x: ladder.x, y: ladder.y, r: 170, color: 0xfff7e0, alpha: 0.9 }, { x: ladder.x, y: ladder.y - 130, r: 120, color: 0xfff7e0, alpha: 0.7 });
    LIGHTS.push({ x: p.x, y: p.y - 24, r: 150, color: 0xebf0ff, alpha: 0.6, follow: p });
    const cam = this.cameras.main, c0 = tileToWorld(14, 14);
    cam.centerOn(c0.x, c0.y - 40);
    const say = (m) => this.scene.get('ui').events.emit('say', m);

    // 누른 것 찾기: 벽·덮개는 그림의 투명하지 않은 곳(depth 큰 것부터), 아니면 바닥 칸
    const hitPiece = (wx, wy) => {
      const c = pieces.filter(s => s.target && s.getBounds().contains(wx, wy)).sort((a, b) => b.depth - a.depth);
      for (const s of c) {
        const a = this.textures.getPixelAlpha(Math.floor(wx - s.x + s.displayOriginX), Math.floor(wy - s.y + s.displayOriginY), s.texture.key);
        if (a > 40) return s.target;
      }
      return null;
    };
    const n4 = (c, r) => [[c - 1, r], [c, r - 1], [c, r + 1], [c + 1, r]];
    const canDig = (c, r) => !isDug(c, r) && c >= 1 && r >= 1 && c < F.cols - 1 && r < F.rows - 1 && n4(c, r).some(([a, b]) => isDug(a, b));
    let busy = false, pc = [14, 14];
    const at = (s, col, row) => { const w = tileToWorld(col, row); return s.setPosition(w.x, w.y).setDepth(10 + w.y); };
    this.input.on('pointerdown', (ptr) => {
      if (busy) return;
      const lb = ladder.getBounds();
      if (lb.contains(ptr.worldX, ptr.worldY) && ptr.worldY < ladder.y - 10) {          // 사다리: 오르는 모습만 보여 주고 다시 내려온다
        busy = window.__busy = true;
        at(p, E.col, E.row + 0.12).setFlipX(false).setDepth(ladder.depth + 1).play('char_player:climb');
        const step = this.time.addEvent({ delay: 460, loop: true, callback: () => this.sfx('ladder') });
        this.tweens.add({ targets: p, y: p.y - 150, alpha: 0, duration: 1400, yoyo: true, hold: 500, onComplete: () => {
          step.remove(); at(p, E.col + 0.6, E.row + 0.6).play('char_player:idle'); pc = [14, 14]; busy = window.__busy = false; window.__climbed = true;
        } });
        say('사다리: climb 애니메이션, 위로 올라가며 흐려진다(실제 게임은 여기서 땅 위로 바뀐다)');
        return;
      }
      let t = hitPiece(ptr.worldX, ptr.worldY);
      if (!t) { const tt = worldToTile(ptr.worldX, ptr.worldY); t = [tt.col, tt.row]; }
      const [tc, tr] = t;
      if (!canDig(tc, tr)) {
        if (!isDug(tc, tr)) {
          const w = tileToWorld(tc, tr), no = this.add.image(w.x, w.y, 'overlay_no').setDepth(3);
          this.time.delayedCall(400, () => no.destroy());
          this.sfx('ui_error');
        }
        return;
      }
      // 서서 팔 칸: 목표와 변을 맞댄 파낸 칸 중 주인공에게 가까운 곳. 방향: 위쪽 두 칸이면 뒷모습, 화면 왼쪽이면 뒤집기
      const stands = n4(tc, tr).filter(([a, b]) => isDug(a, b)).sort((a, b) => ((a[0] - pc[0]) ** 2 + (a[1] - pc[1]) ** 2) - ((b[0] - pc[0]) ** 2 + (b[1] - pc[1]) ** 2));
      const [sc, sr] = stands[0], dc = tc - sc, dr = tr - sr;
      const back = dc < 0 || dr < 0, side = dc < 0 ? 'l' : dr < 0 ? 'r' : 'f';
      pc = [sc, sr];
      busy = window.__busy = true;
      at(p, sc, sr).setFlipX(dc - dr < 0);
      const walls = pieces.filter(s => s.target && s.target[0] === tc && s.target[1] === tr && s.texture.key.startsWith('ug_wall'));
      walls.forEach(s => s.setTint(0xffe2a0));
      const ov = side === 'f' ? this.add.image(tileToWorld(tc, tr).x, tileToWorld(tc, tr).y, 'overlay_dig').setDepth(3) : null;
      const crack = side === 'f' ? put('fx_dig_crack', tc, tr, 'f1', 1.6) : put('fx_dig_crack', sc, sr, side + '1', 10 + tileToWorld(sc, sr).y - 20.5);
      crack.setVisible(false);
      let hits = 0;
      const swing = () => {
        p.play(back ? 'char_player:bpick' : 'char_player:pick');
        this.time.delayedCall(190, () => {                       // pick1(190ms) 다음 = 내려치는 순간(hit 프레임)
          hits++;
          this.sfx('dig_dirt');
          this.cameras.main.shake(60, 0.002);
          if (hits < 4) {
            crack.setVisible(true).setFrame(A.fx_dig_crack.frames.indexOf(side + hits));
            this.time.delayedCall(260, swing);
            return;
          }
          crack.destroy(); if (ov) ov.destroy();
          dug.add(K(tc, tr));
          rebuild();
          this.sfx('rock_break');
          const what = ores.has(K(tc, tr)) ? '철 +2, 돌 +1' : spores.has(K(tc, tr)) ? '포자 +2, 돌 +1' : '돌 +1';
          const w = tileToWorld(tc, tr);
          const tx = this.add.text(w.x, w.y - 60, what, { fontFamily: 'sans-serif', fontSize: '30px', fontStyle: 'bold', color: '#fffcf0', stroke: '#4a3d38', strokeThickness: 6 }).setOrigin(0.5).setDepth(50000);
          this.tweens.add({ targets: tx, y: tx.y - 50, alpha: 0, delay: 500, duration: 700, onComplete: () => tx.destroy() });
          this.time.delayedCall(250, () => { this.sfx('pickup'); p.play('char_player:' + (back ? 'bidle' : 'idle')); busy = window.__busy = false; });
          window.__lastDug = [tc, tr];
          say('판 칸: col ' + tc + ', row ' + tr + ' (' + what + ')  지금 파낸 칸 ' + dug.size + '개');
        });
      };
      swing();
    });
    // 키 큰 조각(벽, 덮개, 기둥)이 주인공을 가리면 반투명하게
    this.events.on('update', () => {
      const pb = p.getBounds();
      let faded = 0;
      for (const s of pieces) {
        if (!s.tallPiece) continue;
        const hide = s.depth > p.depth && Phaser.Geom.Intersects.RectangleToRectangle(s.getBounds(), pb);
        s.setAlpha(hide ? 0.35 : 1);
        faded += hide ? 1 : 0;
      }
      window.__faded = faded;
    });
    const amb = () => this.sound.play('sfx_amb_underground', { loop: true, volume: 0.6 });   // 지하 배경 소리(처음 누를 때 브라우저가 허락)
    if (this.sound.locked) this.sound.once('unlocked', amb); else amb();
    this.time.delayedCall(400, () => { window.__ready = true; });
  }

  update() {
    if (!this.towers) return;
    // 시간은 씬 시계(this.time.now)로 잰다. 트윈, delayedCall 과 같은 시계라서 빨리 감기(timeScale)에도 함께 맞춰진다.
    const time = this.time.now;
    const A = this.A, N = this.N, z = this.target;
    // 과녁 움직이기: 캠프 가운데를 중심으로 반지름 5.6칸의 원(칸 좌표)
    const th = time / 5200;
    const col = this.center[0] + 5.6 * Math.cos(th), row = this.center[1] + 5.6 * Math.sin(th);
    const w = tileToWorld(col, row), px = z.x;
    z.setPosition(w.x, w.y).setDepth(10 + w.y).setFlipX(w.x < px);
    const chest = { x: z.x, y: z.y - 40 };
    window.__turrets = [];
    for (const t of this.towers) {
      t.dir = turretIndex(t.base.x, t.base.y, z.x, z.y, N);
      const name = t.kind === 'bow' ? ((t.shotUntil || 0) > time ? 'shot' : 'load') + t.dir : 'dir' + t.dir;
      t.tur.setFrame(A[t.key].frames.indexOf(name));
      window.__turrets.push({ kind: t.kind, dir: t.dir, frame: name });
      if (time < t.cool) continue;
      t.cool = time + t.every;
      const mz = A[t.key].muzzle[t.dir];
      const from = { x: t.tur.x + mz[0], y: t.tur.y + mz[1] };
      if (t.kind === 'bow') {
        t.shotUntil = time + 250;
        this.fly('proj_arrow', from, chest, 450, Math.min(60, 0.25 * Phaser.Math.Distance.BetweenPoints(from, chest)));
      } else {
        const ang = Phaser.Math.DegToRad(A[t.key].screenAngle[t.dir]);
        const fl = this.add.image(from.x, from.y, 'fx_muzzle').setOrigin(A.fx_muzzle.originX, A.fx_muzzle.originY).setRotation(ang).setDepth(50000);
        this.time.delayedCall(80, () => fl.destroy());
        const sm = this.add.image(from.x, from.y - 6, 'fx_smoke').setDepth(50000);
        this.tweens.add({ targets: sm, y: from.y - 34, alpha: 0, scale: 1.4, duration: 600, onComplete: () => sm.destroy() });
        const L = { x: from.x, y: from.y, r: 110, color: 0xffedc7, alpha: 0.9 };
        LIGHTS.push(L);
        this.time.delayedCall(100, () => LIGHTS.splice(LIGHTS.indexOf(L), 1));
        this.fly('proj_bullet', from, chest, 160, 0);
      }
      window.__fired = (window.__fired || 0) + 1;
    }
  }

  // 날아가는 것: from -> to, ms 동안. h = 포물선 높이(화살). 그림은 오른쪽을 향해 그려져 있어서 날아가는 방향으로 돌린다.
  fly(key, from, to, ms, h) {
    const A = this.A;
    const s = this.add.image(from.x, from.y, key).setOrigin(A[key].originX, A[key].originY).setDepth(50000);
    this.tweens.addCounter({ from: 0, to: 1, duration: ms, onUpdate: (tw) => {
      const t = tw.getValue();
      const x = from.x + (to.x - from.x) * t, y = from.y + (to.y - from.y) * t - h * 4 * t * (1 - t);
      const dx = to.x - from.x, dy = (to.y - from.y) - h * 4 * (1 - 2 * t);
      s.setPosition(x, y).setRotation(Math.atan2(dy, dx));
    }, onComplete: () => { s.destroy(); const hit = this.add.image(to.x, to.y, 'fx_hit').setScale(0.6).setDepth(50000); this.time.delayedCall(150, () => hit.destroy()); } });
  }
}

class UI extends Phaser.Scene {
  constructor() { super('ui'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    if (NIGHT && !MOTION) {
      // 빛 지도: 화면 크기의 그림판. 매 프레임 밤 색으로 채우고 빛을 그린 뒤, 화면에 곱한다(MULTIPLY).
      // UI 씬에서 가장 먼저 만들어야 월드 위, 다른 UI 아래에 그려진다.
      this.lightmap = this.add.renderTexture(0, 0, W, H).setOrigin(0, 0).setBlendMode(Phaser.BlendModes.MULTIPLY);
      this.stamp = this.make.image({ key: 'light_soft', add: false });
    }
    const style = { fontFamily: '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif', fontSize: '28px', fontStyle: 'bold', color: '#4a3d38',
      backgroundColor: '#fbf6ea', padding: { x: 14, y: 8 } };
    const tapText = this.add.text(24, H - 70, FARM ? '화면을 누르면 효과음을 차례로 들려줍니다' : UGM ? '벽이나 앞쪽 어둠(안 판 칸)을 누르면 파고, 사다리를 누르면 오릅니다' : '땅을 누르면 칸 번호가 나옵니다', style);
    this.events.on('say', (msg) => tapText.setText(msg));
    this.events.on('tap', (t) => { if (!FARM) tapText.setText('누른 칸: col ' + t.col + ', row ' + t.row); });
    this.events.on('sound', (n) => tapText.setText('효과음: ' + n));
    this.add.text(24, 24, '확인용 페이지  mode=' + MODE, style);
  }
  update(time) {
    if (!this.lightmap) return;
    const cam = this.scene.get('game').cameras.main, rt = this.lightmap;
    rt.fill(UGM ? UG_COLOR : NIGHT_COLOR);
    for (const L of LIGHTS) {
      if (L.follow) { L.x = L.follow.x; L.y = L.follow.y - 24; }
      const flicker = L.r >= 300 ? 1 + 0.03 * Math.sin(time / 90) + 0.02 * Math.sin(time / 37) : 1;      // 모닥불만 살짝 일렁임
      const size = L.r * 2 * flicker * cam.zoom;
      this.stamp.setTint(L.color).setAlpha(L.alpha).setDisplaySize(size, size);
      // 월드 좌표 -> 화면 좌표 (cam.worldView 는 반올림된 값이라 쓰지 않는다)
      rt.draw(this.stamp, (L.x - cam.midPoint.x) * cam.zoom + cam.width / 2, (L.y - cam.midPoint.y) * cam.zoom + cam.height / 2);
    }
  }
}

window.__game = new Phaser.Game({
  type: Phaser.AUTO, width: 1920, height: 1200, backgroundColor: '#5fa9c8',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Boot, Game, UI],
});
</script>
