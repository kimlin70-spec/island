<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>섬 생존 데모</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="섬 생존">
<meta name="theme-color" content="#e3eaf3">
<style>
  html, body {
    margin: 0; padding: 0;
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e3eaf3;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: absolute; inset: 0; }
  canvas { touch-action: none; -webkit-user-select: none; user-select: none; }
  #rotate {
    display: none;
    position: absolute; inset: 0; z-index: 10;
    background: #e3eaf3; color: #3b2a20;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-weight: bold; font-size: 9vw;
    align-items: center; justify-content: center; text-align: center;
  }
  @media (orientation: portrait) {
    #rotate { display: flex; }
    #game { visibility: hidden; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">가로로 돌려 주세요</div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
